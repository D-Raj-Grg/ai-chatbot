<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#gradient2)"/>

  <!-- AI Brain icon (scaled up) -->
  <g transform="translate(90, 90)">
    <!-- Central neural node -->
    <circle cx="0" cy="0" r="12" fill="white"/>

    <!-- Top node -->
    <circle cx="0" cy="-35" r="9" fill="white" opacity="0.9"/>
    <line x1="0" y1="-12" x2="0" y2="-26" stroke="white" stroke-width="3.5" opacity="0.7"/>

    <!-- Bottom node -->
    <circle cx="0" cy="35" r="9" fill="white" opacity="0.9"/>
    <line x1="0" y1="12" x2="0" y2="26" stroke="white" stroke-width="3.5" opacity="0.7"/>

    <!-- Left node -->
    <circle cx="-35" cy="0" r="9" fill="white" opacity="0.9"/>
    <line x1="-12" y1="0" x2="-26" y2="0" stroke="white" stroke-width="3.5" opacity="0.7"/>

    <!-- Right node -->
    <circle cx="35" cy="0" r="9" fill="white" opacity="0.9"/>
    <line x1="12" y1="0" x2="26" y2="0" stroke="white" stroke-width="3.5" opacity="0.7"/>

    <!-- Diagonal nodes -->
    <circle cx="-25" cy="-25" r="7" fill="white" opacity="0.8"/>
    <line x1="-8" y1="-8" x2="-18" y2="-18" stroke="white" stroke-width="3" opacity="0.6"/>

    <circle cx="25" cy="-25" r="7" fill="white" opacity="0.8"/>
    <line x1="8" y1="-8" x2="18" y2="-18" stroke="white" stroke-width="3" opacity="0.6"/>

    <circle cx="-25" cy="25" r="7" fill="white" opacity="0.8"/>
    <line x1="-8" y1="8" x2="-18" y2="18" stroke="white" stroke-width="3" opacity="0.6"/>

    <circle cx="25" cy="25" r="7" fill="white" opacity="0.8"/>
    <line x1="8" y1="8" x2="18" y2="18" stroke="white" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
